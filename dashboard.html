<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALCHEMIST // SYSTEM HEARTBEAT</title>
  <style>
    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --accent: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #27272a;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .terminal {
      border: 1px solid var(--border);
      padding: 32px;
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    /* Glitch/Flicker */
    @keyframes flicker {
      0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
      20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.3; }
    }

    .title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: flicker 4s infinite;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 4px;
    }

    .label {
      color: var(--muted);
    }

    .val {
      font-weight: bold;
    }

    .val.operational { color: var(--success); }
    .val.degraded { color: var(--warning); }
    .val.failed { color: var(--accent); }
    
    .loading {
      color: var(--muted);
      animation: flicker 1s infinite;
    }

    /* Scanline effect */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(244, 63, 94, 0.1);
      animation: scan 3s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="scanline"></div>
    <div class="title">[+] AI PIPELINE HEARTBEAT</div>
    
    <div id="content">
      <div class="loading">ESTABLISHING CONNECTION TO CORE...</div>
    </div>
  </div>

  <script>
    async function fetchHeartbeat() {
      const contentDiv = document.getElementById('content');
      try {
        // Fetch the heartbeat json generated by the Vercel build script
        const response = await fetch('/heartbeat.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('No heartbeat found');
        
        const data = await response.json();
        
        // Format timestamp
        const date = new Date(data.timestamp);
        const formattedDate = date.toLocaleString('en-US', { hour12: false });

        // Determine status class
        let statusClass = 'operational';
        if (data.status === 'DEGRADED') statusClass = 'degraded';
        if (data.status === 'FAILED') statusClass = 'failed';

        contentDiv.innerHTML = `
          <div class="row">
            <span class="label">SYSTEM STATUS</span>
            <span class="val ${statusClass}">[ ${data.status} ]</span>
          </div>
          <div class="row">
            <span class="label">LAST BUILD SYNC</span>
            <span class="val">${formattedDate}</span>
          </div>
          <div class="row">
            <span class="label">ACTIVE PROVIDER</span>
            <span class="val">${data.provider}</span>
          </div>
          <div class="row">
            <span class="label">FILES EXTRACTED</span>
            <span class="val">${data.files_processed}</span>
          </div>
          <div class="row">
            <span class="label">TOTAL DOCUMENTS</span>
            <span class="val">${data.total_research_files}</span>
          </div>
          <div style="margin-top: 24px; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--success);">
            <div style="width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: flicker 1.5s infinite;"></div>
            <span>Vercel Build Environment Monitoring... OK</span>
          </div>
        `;
      } catch (err) {
        contentDiv.innerHTML = `
          <div class="row">
            <span class="label">SYSTEM STATUS</span>
            <span class="val failed">[ OFFLINE ]</span>
          </div>
          <div style="margin-top: 16px; color: var(--muted); font-size: 0.85rem;">
            No heartbeat signal detected. Build pipeline may not have executed yet.
          </div>
        `;
      }
    }

    // Delay slightly for dramatic effect
    setTimeout(fetchHeartbeat, 800);
  </script>
</body>
</html>
